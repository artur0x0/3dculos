# License gate for the FEA crate. `cargo deny check licenses` fails closed:
# a crate whose license is not listed here does not pass. GPL, AGPL, and LGPL
# (every -only / -or-later form, and the deprecated "+" forms) are absent on
# purpose. Unicode-3.0 is the extra SPDX term unicode-ident carries beside
# MIT OR Apache-2.0; ISC is the same kind of short permissive license used by
# small transitive crates. Add another identifier only when a real dependency
# needs it.

[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "wasm32-unknown-unknown",
]
all-features = false

[licenses]
# The allow list is the policy, not a census of today's graph. Phase 0 does
# not use every identifier; unused entries stay so a later permissive crate
# does not require a policy edit.
unused-allowed-license = "allow"
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "ISC",
]
confidence-threshold = 0.8

[licenses.private]
ignore = false

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
