[package]
name = "surfcad-fea"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "SurfCAD finite-element solver compiled to single-threaded SIMD WebAssembly. Phase 0 stub plus a TET10 linear-static solver."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
faer = { version = "0.24.4", default-features = false, features = ["std", "sparse-linalg"] }
serde = { version = "1", features = ["derive"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
serde-wasm-bindgen = "=0.6.5"
wasm-bindgen = "=0.2.129"

[dev-dependencies]
serde_json = "1"

[profile.release]
codegen-units = 1
debug = false
incremental = false
lto = true
opt-level = "s"
panic = "abort"
strip = "symbols"

[[bench]]
name = "scale"
harness = false

# wasm-pack 0.15 bundles wasm-opt 117, which rejects simd128 and bulk-memory
# unless the features are named. Rust 1.99 emits both.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O", "--enable-simd", "--enable-bulk-memory", "--enable-nontrapping-float-to-int"]
