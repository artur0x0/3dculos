# Pull-request and default-branch CI.
#
# This workflow is not a required status check, and it does not touch branch
# protection. To require it later, add the job names below as required checks
# on the default branch (repository Settings → Rules → Rulesets, or Branch
# protection rules → Require status checks to pass):
#   - lint, build, unit
#   - golden app-loads
#   - license
#   - cargo-deny
#   - wasm freshness
#   - mesh wasm freshness
#   - calculix reference
# cargo-deny and wasm freshness run their real checks when
# packages/surfcad-fea is present. Mesh wasm freshness runs when
# packages/surfcad-mesh/pkg is present. If those files are absent the jobs
# skip and exit 0, because a skipped job would not satisfy a required check.
# GPL, AGPL, and LGPL fail the Rust license check because they are not in
# packages/surfcad-fea/deny.toml's allow list. The license job also rejects
# non-commercial npm licences and fails when public/THIRD_PARTY_NOTICES.txt
# does not match a fresh Rust and npm generation. CalculiX is GPL-2.0-only and
# is not a dependency. The calculix reference job installs the ccx binary
# with apt and runs it as an external process. It is never vendored, linked,
# bundled, or committed. If that install fails, the job emits a warning
# annotation and exits 0. A comparison that runs and misses a gate fails.
#
# Triggers are pull requests into main and pushes to main. There is no spark branch.
# If a step needs the repository name, use ${{ github.repository }}. Do not
# hard-code it; the remote may be renamed.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel a run when a newer commit is pushed to the same branch or PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Fast static checks. Share one npm ci. `npm run verify` is intentionally
  # absent: it calls an external cadgen-workspace gate that is not on the runner.
  check:
    name: lint, build, unit
    runs-on: ubuntu-latest
    # Volume-mesh tests call fTetWild (box, cylinder, plate, L-bracket, cantilever).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: npm ci
        run: npm ci

      # Clean on main. A failure here is a real regression, not a known baseline.
      - name: lint
        run: npm run lint

      - name: vite build
        run: npm run build

      # Bare `node --test` also matches scripts/golden/*playtest*, which are
      # browser goldens (the default pattern is *test*). Pass explicit
      # patterns so those stay out. Node 22 exits 0 when a pattern matches
      # nothing, so an empty tree is success and later files are picked up:
      #   src/**/*.test.{js,mjs,cjs}
      #   test/**/*.{js,mjs,cjs}
      #   tests/**/*.{js,mjs,cjs}
      - name: node --test
        run: |
          node --test --test-reporter spec \
            'src/**/*.test.js' \
            'src/**/*.test.mjs' \
            'src/**/*.test.cjs' \
            'test/**/*.js' \
            'test/**/*.mjs' \
            'test/**/*.cjs' \
            'tests/**/*.js' \
            'tests/**/*.mjs' \
            'tests/**/*.cjs'

  # Cheapest existing golden that proves the bundle actually boots: a real
  # headless Chrome, vite preview, #root painted, canvas + toolbar + Run.
  # Pixel goldens are not in this job. Chrome comes from the runner via
  # setup-chrome; playwright-core does not download a browser. The script
  # exits 0 when CHROME_PATH is missing, so CI checks the binary first and
  # refuses that skip.
  #
  # Shots go to GOLDEN_SHOT_DIR (${{ runner.temp }}/golden) or os.tmpdir().
  # Never /opt/cursor/artifacts.
  smoke:
    name: golden app-loads
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: npm ci
        run: npm ci

      - name: vite build
        run: npm run build

      - name: Install Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
          install-dependencies: true

      - name: App-load golden
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          GOLDEN_SHOT_DIR: ${{ runner.temp }}/golden
        run: |
          test -n "$CHROME_PATH"
          test -x "$CHROME_PATH"
          test -n "$GOLDEN_SHOT_DIR"
          mkdir -p "$GOLDEN_SHOT_DIR"
          "$CHROME_PATH" --version
          node scripts/golden/smoke_app_loads.mjs | tee "${RUNNER_TEMP}/app-loads.log"
          if grep -q 'no system Chrome found' "${RUNNER_TEMP}/app-loads.log"; then
            echo "app-load golden skipped because Chrome was not found; CI must launch it"
            exit 1
          fi

      # Cheapest FEA study golden: one desktop pass against the build this job
      # already produced. The 390px pass runs locally with the same script.
      - name: FEA study panel golden
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          GOLDEN_SHOT_DIR: ${{ runner.temp }}/golden
          FEA_PREVIEW: '1'
          FEA_VIEW: desktop
        run: |
          test -n "$CHROME_PATH"
          test -x "$CHROME_PATH"
          test -n "$GOLDEN_SHOT_DIR"
          mkdir -p "$GOLDEN_SHOT_DIR"
          node scripts/golden/fea_study_panel.mjs | tee "${RUNNER_TEMP}/fea-study.log"
          if grep -q 'no system Chrome' "${RUNNER_TEMP}/fea-study.log"; then
            echo "FEA study golden skipped because Chrome was not found; CI must launch it"
            exit 1
          fi

  # npm copyleft and non-commercial gate, plus a freshness check for
  # public/THIRD_PARTY_NOTICES.txt. Always runs. The cargo-deny step is a
  # separate job so it can stay a no-op until the FEA crate exists.
  # Regenerating the notices needs the pinned Rust toolchain (cargo tree on
  # wasm32) and a Vite production build (the npm section is the bundle's
  # module graph, not the devDependency list).
  license:
    name: license
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: npm ci
        run: npm ci

      - name: Reject copyleft and non-commercial production dependencies
        run: node scripts/ci/check-npm-licenses.mjs

      - name: Read the pinned Rust channel
        id: rust
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' packages/surfcad-fea/rust-toolchain.toml)
          test -n "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Install the pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
          targets: wasm32-unknown-unknown

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/surfcad-fea
          cache-on-failure: true

      - name: Fail if third-party notices are stale
        run: node scripts/ci/generate-third-party-notices.mjs --check

  # License gate for packages/surfcad-fea. cargo-deny is a pinned binary;
  # it reads the lockfile and does not need a Rust toolchain. The allow list
  # in deny.toml is fail-closed: GPL, AGPL, and LGPL are not listed.
  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Detect the FEA crate
        id: crate
        run: |
          if [[ -f packages/surfcad-fea/Cargo.toml ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "skip: packages/surfcad-fea/Cargo.toml is not in this revision"
          fi

      - name: Install cargo-deny 0.20.2
        if: steps.crate.outputs.present == 'true'
        run: |
          set -euo pipefail
          version=0.20.2
          sha=9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
          archive="cargo-deny-${version}-x86_64-unknown-linux-musl.tar.gz"
          url="https://github.com/EmbarkStudios/cargo-deny/releases/download/${version}/${archive}"
          curl -fsSL -o "/tmp/${archive}" "$url"
          echo "${sha}  /tmp/${archive}" | sha256sum -c -
          tar -xzf "/tmp/${archive}" -C /tmp
          mkdir -p "$HOME/.local/bin"
          install -m 755 "/tmp/cargo-deny-${version}-x86_64-unknown-linux-musl/cargo-deny" "$HOME/.local/bin/cargo-deny"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: cargo deny check licenses
        if: steps.crate.outputs.present == 'true'
        run: cargo deny --manifest-path packages/surfcad-fea/Cargo.toml check licenses

  # Rebuilds the committed FEA wasm with the pinned toolchain and wasm-pack,
  # then fails if packages/surfcad-fea/pkg differs byte for byte. Also runs
  # `cargo test` for the stub. Skips when the crate or the wasm is absent.
  wasm-freshness:
    name: wasm freshness
    runs-on: ubuntu-latest
    # faer (sparse supernodal Cholesky) is a large crate. A cold debug
    # `cargo test` plus a release wasm-pack build with LTO does not fit in
    # the original 15 minutes.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Detect the FEA crate and committed wasm
        id: crate
        run: |
          if [[ -f packages/surfcad-fea/Cargo.toml ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "skip: packages/surfcad-fea/Cargo.toml is not in this revision"
          fi
          shopt -s nullglob globstar
          artifacts=(packages/surfcad-fea/pkg/**/*.wasm)
          if (( ${#artifacts[@]} == 0 )); then
            echo "wasm=false" >> "$GITHUB_OUTPUT"
            echo "skip: no committed wasm under packages/surfcad-fea/pkg"
          else
            echo "wasm=true" >> "$GITHUB_OUTPUT"
            printf '  %s\n' "${artifacts[@]}"
          fi

      - name: Read the pinned Rust channel
        id: rust
        if: steps.crate.outputs.present == 'true'
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' packages/surfcad-fea/rust-toolchain.toml)
          test -n "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Install the pinned Rust toolchain
        if: steps.crate.outputs.present == 'true'
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
          targets: wasm32-unknown-unknown

      - name: Cache Cargo
        if: steps.crate.outputs.present == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/surfcad-fea
          cache-on-failure: true

      - name: cargo test
        if: steps.crate.outputs.present == 'true'
        working-directory: packages/surfcad-fea
        run: cargo test --locked

      - uses: actions/setup-node@v4
        if: steps.crate.outputs.wasm == 'true'
        with:
          node-version: 22

      - name: Cache wasm-pack downloads
        if: steps.crate.outputs.wasm == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/wasm-pack
            ~/.cache/.wasm-pack
          key: wasm-pack-0.15.0-${{ runner.os }}-${{ hashFiles('packages/surfcad-fea/Cargo.lock') }}

      - name: Install wasm-pack 0.15.0
        if: steps.crate.outputs.wasm == 'true'
        run: |
          set -euo pipefail
          version=0.15.0
          sha=c09f971ecaed9a2efc80fdcea7a00ef6b53c7fadc8c57d1f61b53a6aa66b668a
          archive="wasm-pack-v${version}-x86_64-unknown-linux-musl.tar.gz"
          url="https://github.com/wasm-bindgen/wasm-pack/releases/download/v${version}/${archive}"
          curl -fsSL -o "/tmp/${archive}" "$url"
          echo "${sha}  /tmp/${archive}" | sha256sum -c -
          tar -xzf "/tmp/${archive}" -C /tmp
          mkdir -p "$HOME/.local/bin"
          install -m 755 "/tmp/wasm-pack-v${version}-x86_64-unknown-linux-musl/wasm-pack" "$HOME/.local/bin/wasm-pack"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Rebuild the committed wasm and fail on drift
        if: steps.crate.outputs.wasm == 'true'
        run: node scripts/fea/check-wasm-fresh.mjs

  # Rebuilds the committed fTetWild wasm with emsdk 6.0.12 and fails if
  # packages/surfcad-mesh/pkg differs byte for byte. Separate from the
  # surfcad-fea wasm-pack job: this module is emscripten, not wasm-bindgen.
  mesh-wasm-freshness:
    name: mesh wasm freshness
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Detect the committed mesh wasm
        id: mesh
        run: |
          if [[ -f packages/surfcad-mesh/pkg/surfcad_mesh.wasm && -f scripts/fea/build-mesh-wasm.mjs ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "skip: packages/surfcad-mesh wasm is not in this revision"
          fi

      - uses: actions/setup-node@v4
        if: steps.mesh.outputs.present == 'true'
        with:
          node-version: 22

      - name: Cache emsdk 6.0.12
        if: steps.mesh.outputs.present == 'true'
        uses: actions/cache@v4
        with:
          path: ~/emsdk
          key: emsdk-6.0.12-${{ runner.os }}

      - name: Cache mesh dependency sources
        if: steps.mesh.outputs.present == 'true'
        uses: actions/cache@v4
        with:
          path: |
            packages/surfcad-mesh/.deps/src
            packages/surfcad-mesh/.deps/fetch-wasm
          key: mesh-deps-${{ runner.os }}-${{ hashFiles('scripts/fea/build-mesh-wasm.mjs', 'scripts/fea/overlay/Rational.h', 'scripts/fea/overlay/Logger.cpp', 'packages/surfcad-mesh/CMakeLists.txt', 'packages/surfcad-mesh/src/api.cpp') }}

      - name: Install the host build tools
        if: steps.mesh.outputs.present == 'true'
        run: sudo apt-get update && sudo apt-get install -y cmake g++ python3

      - name: Rebuild the committed mesh wasm and fail on drift
        if: steps.mesh.outputs.present == 'true'
        run: node scripts/fea/check-mesh-wasm-fresh.mjs

  # External CalculiX reference for solve_tet10 (C3D10) and solve_shell (S6).
  #
  # CalculiX is GPL-2.0-only. This job may install the ccx binary with apt
  # and run it as a separate process. It must not vendor, link, bundle, or
  # commit CalculiX, and it must not add ccx to the Cargo graph. cargo-deny
  # stays fail-closed on GPL. If the apt install fails, the job emits a
  # warning annotation and exits 0 so the absence of the binary is visible
  # and not a silent skip. A comparison that runs and misses a gate fails.
  calculix-reference:
    name: calculix reference
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Detect the FEA crate
        id: crate
        run: |
          if [[ -f packages/surfcad-fea/Cargo.toml && -f packages/surfcad-fea/examples/calculix_reference/main.rs ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=CalculiX reference skipped::packages/surfcad-fea calculix_reference example is not in this revision, so the comparison did not run."
          fi

      # GPL binary, external only. A failed install is a warning, not a
      # green silent skip and not a failed comparison.
      - name: Install CalculiX ccx
        id: ccx
        if: steps.crate.outputs.present == 'true'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set +e
          sudo apt-get update
          sudo apt-get install -y calculix-ccx
          status=$?
          set -e
          if [[ $status -ne 0 ]] || ! command -v ccx >/dev/null 2>&1; then
            echo "::warning title=CalculiX reference skipped::Could not install calculix-ccx from apt (exit ${status}). The reference comparison was skipped. ccx is an external GPL-2.0 binary and is not a dependency of this repository."
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
            # ccx -v prints the banner and exits 201. The install itself succeeded.
            ccx -v || true
          fi

      - name: Read the pinned Rust channel
        id: rust
        if: steps.crate.outputs.present == 'true' && steps.ccx.outputs.available == 'true'
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' packages/surfcad-fea/rust-toolchain.toml)
          test -n "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Install the pinned Rust toolchain
        if: steps.crate.outputs.present == 'true' && steps.ccx.outputs.available == 'true'
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.channel }}

      - name: Cache Cargo
        if: steps.crate.outputs.present == 'true' && steps.ccx.outputs.available == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/surfcad-fea
          cache-on-failure: true

      - name: Compare the solver with CalculiX
        if: steps.crate.outputs.present == 'true' && steps.ccx.outputs.available == 'true'
        working-directory: packages/surfcad-fea
        run: |
          set +e
          set -o pipefail
          cargo run --example calculix_reference --locked --quiet | tee "${RUNNER_TEMP}/calculix-reference.md"
          status=$?
          {
            echo '## CalculiX reference comparison'
            echo
            echo 'CalculiX (`ccx`) is GPL-2.0-only. This job installs it with `apt` and runs it as an external binary. It is not a Cargo dependency, and it is not vendored, linked, bundled, or committed.'
            echo
            cat "${RUNNER_TEMP}/calculix-reference.md"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
